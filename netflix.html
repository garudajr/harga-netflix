<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Harga</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
  <style>@view-transition { navigation: auto; }</style>

  <style>
      body {
          box-sizing: border-box;
          font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          margin: 0;
          padding: 20px;

          /* --- BACKGROUND IMAGE BARU --- */
          background-image: url('https://dnm.nflximg.net/api/v6/BvVbc2Wxr2w6QuoANoSpJKEIWjQ/AAAAQdHbjrX0uL1mH7uUW7VZ-p5GJOSNNRko_9A_12Mlv5wVYQIDy4nuupxLHxkDj9V0e1OLBs_s8ZlxFkyhPlK5XkrlTK0c7yP42LLinQdYhz8lfgUcOH68JAbEcY45jG02gCI1NyKVf1lqxsQFmcNN5szbv8.jpg?r=aee');
          background-size: cover;
          background-position: center;
          background-attachment: fixed; /* Membuat gambar latar belakang tetap saat scroll */
      }
      
      .kalkulator {
          /* --- GLASSMORPHISM PADA KARTU UTAMA --- */
          background-color: rgba(34, 31, 31, 0.75); /* Warna dasar kartu (gelap) dengan transparansi */
          backdrop-filter: blur(10px); /* Efek blur pada konten di belakangnya */
          -webkit-backdrop-filter: blur(10px); /* Untuk Safari */
          border: 1px solid rgba(255, 255, 255, 0.18); /* Border tipis efek kaca */
          border-radius: 12px; /* Ditingkatkan sedikit agar lebih "liquid" */
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); /* Shadow lebih menonjol */
          
          padding: 35px 40px;
          width: 100%;
          max-width: 400px;
      }
      
      .kalkulator h2 {
          text-align: center;
          margin-top: 0;
          margin-bottom: 30px;
          color: #ffffff;
          font-size: 28px;
          font-weight: 700;
      }
      
      .form-grup {
          margin-bottom: 25px;
      }
      
      .form-grup label {
          display: block;
          margin-bottom: 10px;
          font-weight: 500;
          color: #ffffff;
          font-size: 15px;
      }
      
      .form-grup select,
      .form-grup input {
          width: 100%;
          padding: 14px 16px;
          border: 1px solid rgba(255, 255, 255, 0.1); /* Border lebih transparan */
          border-radius: 6px; /* Ditingkatkan sedikit */
          box-sizing: border-box;
          font-size: 16px;
          transition: all 0.3s ease;
          
          /* --- GLASSMORPHISM PADA INPUT/SELECT --- */
          background-color: rgba(51, 51, 51, 0.6); /* Warna input/select dengan transparansi */
          color: #ffffff;
      }

      .form-grup select option {
        background: #333333; /* Opsi dropdown tetap solid agar mudah dibaca */
        color: #ffffff;
      }
      
      .form-grup select:focus,
      .form-grup input:focus {
          outline: none;
          border-color: #e50914;  
          background-color: rgba(64, 64, 64, 0.8); /* Warna fokus dengan transparansi */
          box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.2);
      }
      
      .form-grup select {
          cursor: pointer;
      }
      
      .hasil {
          text-align: center;
          margin-top: 35px;
          padding: 25px;
          /* --- KOTAK HASIL TETAP MERAH SOLID (highlight) --- */
          background: #e50914; /* Tetap merah khas Netflix */
          border-radius: 4px;
          border: 1px solid #b8070f;
          box-shadow: 0 4px 10px rgba(229, 9, 20, 0.4); /* Tambah shadow agar lebih menonjol */
      }
      
      .hasil h3 {
          margin: 0 0 10px 0;
          color: #ffffff;
          font-size: 16px;
          font-weight: 500;
          text-transform: uppercase;
          letter-spacing: 1px;
      }
      
      #hasil-harga {
          color: #ffffff;
          font-size: 36px;
          font-weight: 700;
          display: block;
          text-shadow: none;
      }
      
      @media (max-width: 480px) {
          .kalkulator {
              padding: 25px 20px;
          }
          
          .kalkulator h2 {
              font-size: 24px;
          }
          
          #hasil-harga {
              font-size: 30px;
          }
      }
  </style>
</head>
<body>
  <div class="kalkulator">
    <h2 id="judul">Hitung Harga Netflix Harian</h2>
    
    <div class="form-grup">
      <label for="jenis" id="label-jenis">Pilih Jenis:</label> 
      <select id="jenis"> 
        <option value="1u">1u</option> 
        <option value="2u">2u</option> 
      </select>
    </div>

    <div class="form-grup">
      <label for="hari" id="label-hari">Jumlah Hari (1-7):</label> 
      <input type="number" id="hari" value="1" min="1" max="7">
    </div>

    <div class="hasil">
      <h3 id="label-hasil">Total Harga:</h3>
      <span id="hasil-harga">Rp 0</span>
    </div>
  </div>
  
  <script>
      /* * JAVASCRIPT DEFAULT CONFIG KEMBALI KE GAYA NETFLIX * */
      const defaultConfig = {
          judul_kalkulator: "Hitung Harga Netflix Harian",
          label_jenis: "Pilih Jenis:",
          label_hari: "Jumlah Hari (1-7):",
          label_hasil: "Total Harga:",
          background_color: "url('https://dnm.nflximg.net/api/v6/BvVbc2Wxr2w6QuoANoSpJKEIWjQ/AAAAQdHbjrX0uL1mH7uUW7VZ-p5GJOSNNRko_9A_12Mlv5wVYQIDy4nuupxLHxkDj9V0e1OLBs_s8ZlxFkyhPlK5XkrlTK0c7yP42LLinQdYhz8lfgUcOH68JAbEcY45jG02gCI1NyKVf1lqxsQFmcNN5szbv8.jpg?r=aee')", // Ini harusnya tidak hanya warna, tapi URL gambar
          secondary_color: "#e50914",    // Warna merah
          text_color: "#ffffff",
          card_background: "rgba(34, 31, 31, 0.75)", // Diubah jadi RGBA
          accent_color: "rgba(51, 51, 51, 0.6)",    // Diubah jadi RGBA
          font_family: "Netflix Sans",    // Font
          font_size: 16
      };

      const jenisSelect = document.getElementById('jenis');
      const hariInput = document.getElementById('hari');
      const hasilSpan = document.getElementById('hasil-harga');

      
      function hitungHarga() {
          const jenisUser = jenisSelect.value; 
          const jumlahHari = parseInt(hariInput.value);

          if (jumlahHari < 1 || jumlahHari > 7 || isNaN(jumlahHari)) {
              hasilSpan.textContent = "Error";
              return;
          }

          let totalHarga = 0; 

          if (jenisUser === "1u") {
              if (jumlahHari === 1) {
                  totalHarga = 1500; 
              } else if (jumlahHari === 2) {
                  totalHarga = 2500; 
              } else if (jumlahHari === 3) {
                  totalHarga = 3000; 
              } else {
                  // Asumsi untuk hari ke 4-7 (sesuai input max="7")
                  totalHarga = 3000 + (500 * (jumlahHari - 3));
              }

          } else if (jenisUser === "2u") {
              if (jumlahHari === 1) {
                  totalHarga = 1000; 
              } else if (jumlahHari === 2) {
                  totalHarga = 2000; 
              } else if (jumlahHari === 3) {
                  totalHarga = 2500; 
              } else {
                  // Asumsi untuk hari ke 4-7
                  totalHarga = 2500 + (500 * (jumlahHari - 3));
              }
          }
          
          hasilSpan.textContent = 'Rp ' + totalHarga.toLocaleString('id-ID');
      }
      jenisSelect.addEventListener('change', hitungHarga);
      hariInput.addEventListener('input', hitungHarga);

      async function onConfigChange(config) {
          const judul = config.judul_kalkulator || defaultConfig.judul_kalkulator;
          const labelJenis = config.label_jenis || defaultConfig.label_jenis;
          const labelHari = config.label_hari || defaultConfig.label_hari;
          const labelHasil = config.label_hasil || defaultConfig.label_hasil;
          const bgColor = config.background_color || defaultConfig.background_color;
          const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
          const textColor = config.text_color || defaultConfig.text_color;
          const cardBg = config.card_background || defaultConfig.card_background;
          const accentColor = config.accent_color || defaultConfig.accent_color;
          const fontFamily = config.font_family || defaultConfig.font_family;
          const fontSize = config.font_size || defaultConfig.font_size;

          document.getElementById('judul').textContent = judul;
          document.getElementById('label-jenis').textContent = labelJenis;
          document.getElementById('label-hari').textContent = labelHari;
          document.getElementById('label-hasil').textContent = labelHasil;

          // Perhatikan cara set background body untuk gambar
          if (bgColor.startsWith('url(')) {
            document.body.style.backgroundImage = bgColor; // Langsung pakai jika sudah format URL
          } else {
            document.body.style.background = bgColor; // Fallback jika hanya warna
          }
          document.body.style.backgroundSize = `cover`;
          document.body.style.backgroundPosition = `center`;
          document.body.style.backgroundAttachment = `fixed`;

          document.querySelector('.kalkulator').style.backgroundColor = cardBg;
          document.querySelector('.kalkulator').style.backdropFilter = 'blur(10px)';
          document.querySelector('.kalkulator').style.webkitBackdropFilter = 'blur(10px)';
          document.querySelector('.kalkulator').style.border = '1px solid rgba(255, 255, 255, 0.18)';


          document.querySelector('.kalkulator h2').style.color = textColor;
          document.querySelectorAll('.form-grup label').forEach(label => {
              label.style.color = textColor;
          });
          document.querySelectorAll('.form-grup select, .form-grup input').forEach(input => {
              input.style.borderColor = accentColor.replace('rgba', 'rgba').replace(', 0.6)', ', 0.1)'); // Border lebih tipis
              input.style.backgroundColor = accentColor;
              input.style.color = textColor;
          });
          document.querySelector('.hasil').style.background = secondaryColor;

          const baseFontStack = 'Tahoma, Geneva, Verdana, sans-serif';
          document.body.style.fontFamily = `${fontFamily}, ${baseFontStack}`;
          
          document.querySelector('.kalkulator h2').style.fontSize = `${fontSize * 1.75}px`;
          document.querySelectorAll('.form-grup label').forEach(label => {
              label.style.fontSize = `${fontSize * 0.9375}px`;
          });
          document.querySelectorAll('.form-grup select, .form-grup input').forEach(input => {
              input.style.fontSize = `${fontSize}px`;
          });
          document.querySelector('.hasil h3').style.fontSize = `${fontSize}px`;
          document.getElementById('hasil-harga').style.fontSize = `${fontSize * 2.25}px`;
      }

      if (window.elementSdk) {
          window.elementSdk.init({
              defaultConfig,
              onConfigChange,
              mapToCapabilities: (config) => ({
                  recolorables: [
                      {
                          get: () => config.background_color || defaultConfig.background_color,
                          set: (value) => {
                              config.background_color = value;
                              window.elementSdk.setConfig({ background_color: value });
                          }
                      },
                      {
                          get: () => config.secondary_color || defaultConfig.secondary_color,
                          set: (value) => {
                              config.secondary_color = value;
                              window.elementSdk.setConfig({ secondary_color: value });
                          }
                      },
                      {
                          get: () => config.text_color || defaultConfig.text_color,
                          set: (value) => {
                              config.text_color = value;
                              window.elementSdk.setConfig({ text_color: value });
                          }
                      },
                      {
                          get: () => config.card_background || defaultConfig.card_background,
                          set: (value) => {
                              config.card_background = value;
                              window.elementSdk.setConfig({ card_background: value });
                          }
                      },
                      {
                          get: () => config.accent_color || defaultConfig.accent_color,
                          set: (value) => {
                              config.accent_color = value;
                              window.elementSdk.setConfig({ accent_color: value });
                          }
                      }
                  ],
                  borderables: [],
                  fontEditable: {
                      get: () => config.font_family || defaultConfig.font_family,
                      set: (value) => {
                          config.font_family = value;
                          window.elementSdk.setConfig({ font_family: value });
                      }
                  },
                  fontSizeable: {
                      get: () => config.font_size || defaultConfig.font_size,
                      set: (value) => {
                          config.font_size = value;
                          window.elementSdk.setConfig({ font_size: value });
                      }
                  }
              }),
              mapToEditPanelValues: (config) => new Map([
                  ["judul_kalkulator", config.judul_kalkulator || defaultConfig.judul_kalkulator],
                  ["label_jenis", config.label_jenis || defaultConfig.label_jenis],
                  ["label_hari", config.label_hari || defaultConfig.label_hari],
                  ["label_hasil", config.label_hasil || defaultConfig.label_hasil]
              ])
          });
      }

      // Memanggil hitungHarga() saat awal dimuat
      hitungHarga();
  </script>
</body>
</html>
