<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Price Calculator</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
      body {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          height: 100%;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 50%, #000000 100%);
          position: relative;
          overflow: auto;
      }
      body::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-image: 
              radial-gradient(circle at 20% 30%, rgba(229, 9, 20, 0.15) 0%, transparent 50%),
              radial-gradient(circle at 80% 70%, rgba(229, 9, 20, 0.1) 0%, transparent 50%);
          pointer-events: none;
      }
      .container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 40px 20px;
          position: relative;
          z-index: 1;
      }
      .title {
          text-align: center;
          font-size: 48px;
          font-weight: bold;
          color: #E50914;
          margin-bottom: 60px;
          text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
      }
      .flowchart {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 30px;
      }
      .glass-box {
          background: rgba(255, 255, 255, 0.05);
          backdrop-filter: blur(15px);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 30px;
          padding: 25px 35px;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
          color: white;
          font-size: 18px;
          font-weight: 500;
          text-align: center;
          min-width: 250px;
      }
      .input-section {
          display: flex;
          gap: 30px;
          flex-wrap: wrap;
          justify-content: center;
      }
      .input-box {
          display: flex;
          flex-direction: column;
          gap: 10px;
      }
      .input-box label {
          font-size: 16px;
          color: rgba(255, 255, 255, 0.9);
      }
      
      /* Ini blok CSS yang kita diskusikan */
      select, input[type="number"] {
          background: rgba(255, 255, 255, 0.08);
          border: 1px solid rgba(255, 255, 255, 0.15);
          border-radius: 20px;
          padding: 12px 20px;
          color: white;
          font-size: 18px;
          font-weight: 600;
          outline: none;
          min-width: 150px;
          width: 180px; /* Atur lebar di sini */
          box-sizing: border-box; /* Memastikan ukuran tetap konsisten */
      }

      select option {
          background: #1a0000;
          color: white;
      }
      .bubble-button {
          background: rgba(255, 255, 255, 0.08);
          backdrop-filter: blur(20px);
          border: 2px solid rgba(255, 255, 255, 0.15);
          border-radius: 50px;
          padding: 15px 40px;
          color: white;
          font-size: 18px;
          font-weight: bold;
          cursor: pointer;
          margin-top: 20px;
          transition: all 0.3s ease;
          box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }
      .bubble-button:hover {
          background: rgba(229, 9, 20, 0.3);
          border-color: rgba(229, 9, 20, 0.6);
          transform: translateY(-2px);
          box-shadow: 0 12px 35px rgba(229, 9, 20, 0.3);
      }
      .bubble-button:active {
          transform: translateY(0);
          box-shadow: 0 6px 20px rgba(229, 9, 20, 0.2);
      }
      .result-box {
          background: rgba(255, 255, 255, 0.05);
          backdrop-filter: blur(20px);
          border: 2px solid rgba(229, 9, 20, 0.3);
          border-radius: 30px;
          padding: 40px 60px;
          color: white;
          font-size: 42px;
          font-weight: bold;
          box-shadow: 0 15px 50px rgba(229, 9, 20, 0.2);
          text-align: center;
          min-width: 300px;
          animation: slideIn 0.5s ease-out;
      }
      @keyframes slideIn {
          from {
              opacity: 0;
              transform: translateY(20px);
          }
          to {
              opacity: 1;
              transform: translateY(0);
          }
      }
      .result-label {
          font-size: 20px;
          font-weight: normal;
          margin-bottom: 15px;
          opacity: 0.9;
      }
      @media (max-width: 768px) {
          .title {
              font-size: 32px;
          }
          .glass-box {
              min-width: 200px;
              padding: 20px 25px;
              font-size: 16px;
          }
          .result-box {
              font-size: 32px;
              padding: 30px 40px;
          }
      }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
</head>
<body>
  <div class="container">
    <div class="title" id="title">
      Kalkulator Harga Netflix
    </div>
    <div class="flowchart">
      <div class="glass-box">
        <div class="input-section">
          <div class="input-box">
            <label id="typeLabel">Pilih Jenis Akun:</label>
            <select id="typeSelect">
              <option value="1u">1u</option>
              <option value="2u">2u</option>
            </select>
          </div>
          <div class="input-box">
            <label id="daysLabel">Jumlah Hari:</label>
            <input type="number" id="daysInput" value="3" min="1" max="30">
          </div>
        </div>
        <button class="bubble-button" id="calculateBtn">Hitung Harga</button>
      </div>
      <div class="result-box" id="resultBox" style="display: none;">
        <div class="result-label" id="resultLabel">
          Total Harga:
        </div>
        <div id="resultValue">
          Rp 0
        </div>
      </div>
    </div>
  </div>

  <script>
      const defaultConfig = {
          title_text: "Kalkulator Harga Netflix",
          type_label: "Pilih Jenis Akun:",
          days_label: "Jumlah Hari:",
          calculate_button: "Hitung Harga",
          result_label: "Total Harga:",
          background_color: "#0a0a0a",
          glass_color: "#ffffff",
          text_color: "#ffffff",
          accent_color: "#E50914",
          font_family: "Segoe UI",
          font_size: 16
      };

      // --- INI FUNGSI YANG SUDAH DIPERBARUI ---
      function calculatePrice() {
          const type = document.getElementById('typeSelect').value;
          const days = parseInt(document.getElementById('daysInput').value);
          
          // Sembunyikan hasil jika input tidak valid (di luar 1-30 hari)
          if (!days || days < 1 || days > 30) {
              document.getElementById('resultBox').style.display = 'none'; 
              return;
          }

          let price = 0;
          let price2u = 0; // Ini akan jadi harga dasar

          // --- Daftar Harga 2U (sesuai daftar baru Anda) ---
          const basePrices2u = {
              1: 1000, // 1k
              2: 2000, // 2k
              3: 2500, // 2.5k
              4: 3000, // 3k
              5: 3500, // 3.5k
              6: 4000, // 4k
              7: 4500  // 4.5k
          };
          
          // --- Aturan perhitungan ---
          
          // 1. Hitung dulu harga 2U
          if (days <= 7) {
              // Gunakan harga dari daftar jika 1-7 hari
              price2u = basePrices2u[days];
          } else {
              // Untuk hari ke-8 dst:
              // Harga hari ke-7 (4.500) + 500 per hari tambahan
              const extraDays = days - 7;
              price2u = 4500 + (extraDays * 500);
          }

          // 2. Tentukan harga final berdasarkan Tipe Akun
          if (type === '1u') {
              // Aturan baru: Harga 1U = Harga 2U + 500
              price = price2u + 500;
          } else if (type === '2u') {
              // Harga 2U adalah harga dasar
              price = price2u;
          }

          
          // Tampilkan dan perbarui hasil
          if (price) {
              document.getElementById('resultValue').textContent = `Rp ${price.toLocaleString('id-ID')}`;
              document.getElementById('resultBox').style.display = 'block';
              
              // Scroll ke hasil agar terlihat
              document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
          } else {
              // Sembunyikan jika karena alasan tertentu harga tidak ditemukan
              document.getElementById('resultBox').style.display = 'none';
          }
      }
      // --- BATAS AKHIR FUNGSI BARU ---


      // Add event listeners
      document.addEventListener('DOMContentLoaded', function() {
          document.getElementById('calculateBtn').addEventListener('click', calculatePrice);
          
          // Auto calculate when inputs change
          document.getElementById('typeSelect').addEventListener('change', function() {
              const days = document.getElementById('daysInput').value;
              if (days) {
                  calculatePrice();
              }
          });
          
          document.getElementById('daysInput').addEventListener('input', function() {
              const type = document.getElementById('typeSelect').value;
              const days = this.value;
              // Hanya hitung jika ada tipe dan hari
              if (type && days) {
                  calculatePrice();
              } else if (!days) {
                  // Sembunyikan hasil jika input hari dihapus
                  document.getElementById('resultBox').style.display = 'none';
              }
          });

          // Hitung saat pertama kali dimuat dengan nilai default
          calculatePrice();
      });

      async function onConfigChange(config) {
          const baseSize = config.font_size || defaultConfig.font_size;
          const customFont = config.font_family || defaultConfig.font_family;
          const baseFontStack = 'Tahoma, Geneva, Verdana, sans-serif';
          
          document.getElementById('title').textContent = config.title_text || defaultConfig.title_text;
          document.getElementById('title').style.fontFamily = `${customFont}, ${baseFontStack}`;
          document.getElementById('title').style.fontSize = `${baseSize * 3}px`;
          document.getElementById('title').style.color = config.accent_color || defaultConfig.accent_color;
          
          document.getElementById('typeLabel').textContent = config.type_label || defaultConfig.type_label;
          document.getElementById('typeLabel').style.fontFamily = `${customFont}, ${baseFontStack}`;
          document.getElementById('typeLabel').style.fontSize = `${baseSize}px`;
          
          document.getElementById('daysLabel').textContent = config.days_label || defaultConfig.days_label;
          document.getElementById('daysLabel').style.fontFamily = `${customFont}, ${baseFontStack}`;
          document.getElementById('daysLabel').style.fontSize = `${baseSize}px`;
          
          document.getElementById('calculateBtn').textContent = config.calculate_button || defaultConfig.calculate_button;
          document.getElementById('calculateBtn').style.fontFamily = `${customFont}, ${baseFontStack}`;
          document.getElementById('calculateBtn').style.fontSize = `${baseSize * 1.125}px`;
          
          document.getElementById('resultLabel').textContent = config.result_label || defaultConfig.result_label;
          document.getElementById('resultLabel').style.fontFamily = `${customFont}, ${baseFontStack}`;
          document.getElementById('resultLabel').style.fontSize = `${baseSize * 1.25}px`;
          
          document.querySelector('.result-box').style.background = config.accent_color || defaultConfig.accent_color; 
          
          document.body.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color} 0%, #1a0000 50%, #000000 100%)`;
      }

      if (window.elementSdk) {
          window.elementSdk.init({
              defaultConfig,
              onConfigChange,
              mapToCapabilities: (config) => ({
                  recolorables: [
                      {
                          get: () => config.background_color || defaultConfig.background_color,
                          set: (value) => {
                              config.background_color = value;
                              window.elementSdk.setConfig({ background_color: value });
                          }
                      },
                      {
                          get: () => config.glass_color || defaultConfig.glass_color,
                          set: (value) => {
                              config.glass_color = value;
                              window.elementSdk.setConfig({ glass_color: value });
                          }
                      },
                      {
                          get: () => config.text_color || defaultConfig.text_color,
                          set: (value) => {
                              config.text_color = value;
                              window.elementSdk.setConfig({ text_color: value });
                          }
                      },
                      {
                          get: () => config.accent_color || defaultConfig.accent_color,
                          set: (value) => {
                              config.accent_color = value;
                              window.elementSdk.setConfig({ accent_color: value });
                          }
                      }
                  ],
                  borderables: [],
                  fontEditable: {
                      get: () => config.font_family || defaultConfig.font_family,
                      set: (value) => {
                          config.font_family = value;
                          window.elementSdk.setConfig({ font_family: value });
                      }
                  },
                  fontSizeable: {
                      get: () => config.font_size || defaultConfig.font_size,
                      set: (value) => {
                          config.font_size = value;
                          window.elementSdk.setConfig({ font_size: value });
                      }
                  }
              }),
              mapToEditPanelValues: (config) => new Map([
                  ["title_text", config.title_text || defaultConfig.title_text],
                  ["type_label", config.type_label || defaultConfig.type_label],
                  ["days_label", config.days_label || defaultConfig.days_label],
                  ["calculate_button", config.calculate_button || defaultConfig.calculate_button],
                  ["result_label", config.result_label || defaultConfig.result_label]
              ])
          });
      }
  </script>
</body>
</html>
